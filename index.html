<title>Takart élek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed canvas = one drawing sheet; all UI is drawn on the sheet itself.
   Deliberately single-theme: paper white, as on e-ink. */
:root{--paper:#ffffff;--ink:#141414;color-scheme:light}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{overflow:hidden}
#cv{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);
  width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:block;touch-action:none;background:var(--paper)}
#flash{position:fixed;inset:0;z-index:5;pointer-events:none}
#flash[hidden]{display:none}
#lockui{position:fixed;z-index:4;display:flex;gap:8px}
#lockui[hidden]{display:none}
#pw{flex:1;min-width:0;font:700 18px "Roboto Mono",ui-monospace,monospace;color:#141414;background:#fff;border:2.5px solid #141414;border-radius:0;padding:0 10px}
#pw::placeholder{color:#9a9a9a;font-weight:400}
#pwgo{flex:none;background:#141414;border:2.5px solid #141414;border-radius:0;display:grid;place-items:center;padding:0;cursor:pointer}
#pw:focus-visible,#pwgo:focus-visible{outline:3px solid #141414;outline-offset:2px}
</style>

<canvas id="cv" aria-label="Takart élek – műszaki rajzos fejtörő"></canvas>
<div id="flash" hidden></div>
<div id="lockui" hidden><input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="jelszó"><button id="pwgo" type="button" aria-label="Feloldás"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="9" cy="15" r="6" fill="none" stroke="#fff" stroke-width="3"/><path d="M15 15h13M23 15v5M27 15v4" stroke="#fff" stroke-width="3" fill="none"/></svg></button></div>

const LW={thick:1.6,med:1.1,thin:0.8};
function applyLW(){const m=S.set.mult;LW.thick=1.6*m;LW.med=1.1*m;LW.thin=.8*m;}
const gray=p=>{const v=Math.round(255*(1-p));return`rgb(${v},${v},${v})`;};
function pen(w,dash,color){ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.lineDashOffset=0;ctx.strokeStyle=color||INK;}
function seg(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function poly(p,close=true){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(close)ctx.closePath();}
function path2d(p){const r=new Path2D();p.forEach((q,i)=>i?r.lineTo(q[0],q[1]):r.moveTo(q[0],q[1]));r.closePath();return r;}
function rectPath(x,y,w,h){const p=new Path2D();p.rect(x,y,w,h);return p;}
function bboxOf(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of p){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y);}return[a,b,c-a,d-b];}
// extra points for all lettering: automatic on small screens, or the player's own choice
// screen diagonal in CSS px: B6 ≈ 714–962, phones ≈ 880, 7–8" readers ≈ 1050–1250, 10"+ tablets ≥ 1400
function autoBoost(){const d=Math.hypot(screen.width||innerWidth,screen.height||innerHeight);return d<1100?2:d<1350?1:0;}
function fontBoost(){return S.set.font==null?autoBoost():S.set.font;}
/* ---------- language: the table lives in the #i18n JSON block above ---------- */
const I18N=JSON.parse(document.getElementById('i18n').textContent);
const LANGS=[{k:'en',label:'UK/US'},{k:'de',label:'DEU'},{k:'it',label:'ITA'},{k:'hu',label:'HUN'}];
let TL=null,TMAP={},TUP={},TPAT=[],rawText=false;
function buildT(){const lg=S.set.lang;if(TL===lg)return;TL=lg;TMAP={};TUP={};TPAT=[];if(lg==='hu')return;
  I18N.entries.forEach(e=>{const v=e[lg];if(!v)return;
    if(/\{\w+\}/.test(e.hu)){const names=[];const src=e.hu.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\w+)\}/g,(m,n)=>{names.push(n);return '(.+?)';});
      TPAT.push({re:new RegExp('^'+src+'$'),names,v});}
    else{TMAP[e.hu]=v;TUP[e.hu.toUpperCase()]=v.toUpperCase();}});}
function T(s){buildT();if(rawText||S.set.lang==='hu'||!s)return s;
  if(TMAP[s]!=null)return TMAP[s];if(TUP[s]!=null)return TUP[s];
  for(const p of TPAT){const m=s.match(p.re);if(m){let out=p.v;p.names.forEach((n,i)=>{out=out.split('{'+n+'}').join(T(m[i+1]));});return out;}}
  let m=s.match(/^(\d+) (.+)$/);if(m&&T(m[2])!==m[2])return m[1]+' '+T(m[2]);
  m=s.match(/^(.+) ▮$/);if(m)return T(m[1])+' ▮';
  if(s.includes(' · ')){const parts=s.split(' · '),tp=parts.map(T);if(tp.some((x,i)=>x!==parts[i]))return tp.join(' · ');}
  return s;}
function txt(s,x,y,size=10,align='left',weight=700,color=INK,base='alphabetic',maxW=0){
  if(window.__cap)window.__cap(String(s));
  s=T(String(s));
  size+=2+fontBoost();const f=sz=>`${weight} ${sz}px "Roboto Mono", ui-monospace, "Courier New", monospace`;ctx.font=f(size);
  if(maxW){const w=ctx.measureText(s).width;if(w>maxW)ctx.font=f(size*maxW/w);}
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y);}
function hatch(clip,b,ang,sp,lw,color=INK){
  ctx.save();ctx.clip(clip);pen(lw,null,color);
  const cx=b[0]+b[2]/2,cy=b[1]+b[3]/2,R=Math.hypot(b[2],b[3])/2+sp,a=ang*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx;
  ctx.beginPath();for(let t=-R;t<=R;t+=sp){const x=cx+nx*t,y=cy+ny*t;ctx.moveTo(x-dx*R,y-dy*R);ctx.lineTo(x+dx*R,y+dy*R);}ctx.stroke();ctx.restore();}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function isoCube(cx,cy,a){
  const c=C30*a,h=a/2;
  const F={top:[[cx,cy-a],[cx+c,cy-h],[cx,cy],[cx-c,cy-h]],right:[[cx,cy],[cx+c,cy-h],[cx+c,cy+h],[cx,cy+a]],left:[[cx-c,cy-h],[cx,cy],[cx,cy+a],[cx-c,cy+h]]};
  let p=path2d(F.top);ctx.fillStyle='#fff';ctx.fill(p);pen(LW.med);ctx.stroke(p);
  p=path2d(F.left);ctx.fillStyle='#fff';ctx.fill(p);hatch(p,bboxOf(F.left),90,Math.max(3.5,a/7),LW.thin);pen(LW.med);ctx.stroke(p);
  p=path2d(F.right);ctx.fillStyle=gray(.42);ctx.fill(p);pen(LW.med);ctx.stroke(p);
}

/* ---------- foil levels ---------- */
// Foils are authored in their correct orientation and place; the printed registration marks
// and the solution are derived from that, and each foil starts rotated by rot0 in the tray.
function foilLevel(l){
  const N=l.N,sol=Array.from({length:N},()=>Array(N).fill(0));
  if(l.mode==='outline'){
    const sh=l.shape.map(r=>r.split('').map(c=>c==='#'?1:0));
    sh.forEach((r,y)=>r.forEach((v,x)=>sol[y][x]=v));
    const E=[],on=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&sh[y][x];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(sh[y][x]){
      if(!on(x,y-1))E.push([x,y,x+1,y]);if(!on(x,y+1))E.push([x,y+1,x+1,y+1]);
      if(!on(x-1,y))E.push([x,y,x,y+1]);if(!on(x+1,y))E.push([x+1,y,x+1,y+1]);}
    l.foils.forEach(f=>f.edges=[]);
    E.forEach(e=>{const mx=(e[0]+e[2])/2,my=(e[1]+e[3])/2;
      const f=l.foils.find(f=>mx>=f.pos[0]&&mx<=f.pos[0]+f.w&&my>=f.pos[1]&&my<=f.pos[1]+f.h);
      if(f)f.edges.push([e[0]-f.pos[0],e[1]-f.pos[1],e[2]-f.pos[0],e[3]-f.pos[1]]);});
  }else{
    l.foils.forEach(f=>(f.dots||[]).forEach(([x,y])=>{const gx=f.pos[0]+x,gy=f.pos[1]+y;sol[gy][gx]=l.mode==='xor'?sol[gy][gx]^1:1;}));
  }
  l.printed=[];l.foils.forEach(f=>f.regs.forEach(([x,y],k)=>l.printed.push([f.pos[0]+x,f.pos[1]+y,k])));
  l.solution=sol;l.maxH=1;l.sheets=['foil','plan'];
  l.check=function(g){return g.every((r,y)=>r.every((v,x)=>v===this.solution[y][x]));};
  return l;
}
function chainLevel(l){
  l.solution=l.shape.map(r=>r.split('').map(c=>c==='#'?1:0));l.maxH=1;l.sheets=['chain'];
  l.check=function(g){return g.every((r,y)=>r.every((v,x)=>v===this.solution[y][x]));};return l;}
function drillLevel(l){

function barrierLevel(l){
  l.maxH=1;l.sheets=['barrier','plan'];l.solution=l.sol.map(r=>r.split('').map(c=>c==='#'?1:0));
  l.check=function(g){return g.every((r,y)=>r.every((v,x)=>v===this.solution[y][x]));};return l;}
function logLevel(l){
  const N=l.N;let g=l.base.map(r=>r.split('').map(c=>c==='#'?1:0));
  const OPS={fillRow:(g,a)=>g.map((r,y)=>y===a?r.map(()=>1):r),clearRow:(g,a)=>g.map((r,y)=>y===a?r.map(()=>0):r),
    fillCol:(g,a)=>g.map(r=>r.map((v,x)=>x===a?1:v)),clearCol:(g,a)=>g.map(r=>r.map((v,x)=>x===a?0:v)),

function foldLevel(l){

function shadowLevel(l){

      if(b===0)sol[Y][X]=1;else if(l.roofs&&b<=h-k)sol[Y][X]=1;}}

  l.check=function(g){return g.every((r,y)=>r.every((v,x)=>v===this.solution[y][x]));};return l;}
function roomLevel(l){l.N=1;l.maxH=1;l.sheets=['room','sunM','sunN','sunA'];l.check=()=>roomSolved();return l;}
function consLevel(l){l.N=1;l.maxH=1;l.sheets=['cons'];l.check=()=>consSolved();return l;}
const fdim=f=>{const s=f.scl||1;return f.rot%2?[f.h*s,f.w*s]:[f.w*s,f.h*s];};
function fpt(f,x,y){if(f.flip)x=f.w-x;let W=f.w,H=f.h;for(let i=0;i<f.rot%4;i++){[x,y]=[H-y,x];[W,H]=[H,W];}return[x,y];}
function foilRect(f){
  const{GX,GY,cell}=geo(),[w,h]=fdim(f);
  if(f.dragAt)return[f.dragAt[0],f.dragAt[1],w*cell,h*cell];

  const dot=(cx,cy,m)=>plateDot(cx,cy,m,cell);

  if(h>=3){ctx.fillStyle=INK;ctx.fill(pp);return;}

function drawIso(cx,cy){
  const l=L(),g=S.grid,N=l.N,s=Math.min(127/N,240/(N+l.maxH),34);
  const ox=cx,oy=cy-(N*s)/2+l.maxH*s/2,P=(x,y,z)=>[ox+(x-y)*C30*s,oy+(x+y)*s/2-z*s];
  // floor
  const fl=[P(0,0,0),P(N,0,0),P(N,N,0),P(0,N,0)];pen(LW.thin);poly(fl);ctx.stroke();
  const cubes=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(let z=0;z<g[y][x];z++)cubes.push([x,y,z]);
  cubes.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]);
  const n=S.anim?Math.floor(S.anim.p*cubes.length+.001):cubes.length;
  cubes.slice(0,n).forEach(([x,y,z])=>{const[px,py]=P(x+.5,y+.5,z+.5);isoCube(px,py,s);});
}

function profilePts(vals,x0,cell,FB,hz){
  const pts=[[x0,FB]];vals.forEach((v,i)=>{pts.push([x0+i*cell,FB-v*hz],[x0+(i+1)*cell,FB-v*hz]);});pts.push([x0+vals.length*cell,FB]);return pts;}
function drawElev(vals,holeSets,x0,labels,title){

/* ---------- construction sheet: 45° mitre line ---------- */
const CU=26,CFX=80,CFZ=300,CTY=350,CSX=340,CREF=[CSX,CTY],CCLIP=[30,118,540,410];
const cF=(x,z)=>[CFX+x*CU,CFZ-z*CU],cT=(x,d)=>[CFX+x*CU,CTY+d*CU];
function consVerts(){const l=L(),v=[];const add=p=>{if(!v.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<1))v.push(p);};
  l.front.forEach(([a,b,c,d])=>{add(cF(a,b));add(cF(c,d));});l.top.forEach(([a,b,c,d])=>{add(cT(a,b));add(cT(c,d));});
  (l.topPts||[]).forEach(([a,b])=>add(cT(a,b)));add(CREF.slice());return v;}
const DIRS={h:[1,0],v:[0,1],m:[1,1]};
function lineX(a,b){const[da,db]=[DIRS[a.t],DIRS[b.t]],den=da[0]*db[1]-da[1]*db[0];if(Math.abs(den)<1e-9)return null;
  const t=((b.x-a.x)*db[1]-(b.y-a.y)*db[0])/den;return[a.x+da[0]*t,a.y+da[1]*t];}
function inClip(p){return p[0]>=CCLIP[0]-.5&&p[0]<=CCLIP[0]+CCLIP[2]+.5&&p[1]>=CCLIP[1]-.5&&p[1]<=CCLIP[1]+CCLIP[3]+.5;}
function consPoints(){const ls=S.cons.lines,pts=consVerts().map(p=>({p,v:1}));
  for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){const q=lineX(ls[i],ls[j]);if(q&&inClip(q)&&!pts.some(o=>Math.hypot(o.p[0]-q[0],o.p[1]-q[1])<1))pts.push({p:q,v:0});}
  return pts;}
function snap(p,r=16){let b=null,bd=r;for(const o of consPoints()){const d=Math.hypot(o.p[0]-p[0],o.p[1]-p[1]);if(d<bd){bd=d;b=o.p;}}return b;}
function consTap(p){
  const C=S.cons;if(C.closed&&C.tool!=='dash')return;const q=snap(p);if(!q)return;
  if(C.tool==='dash'){
    if(!C.segA){C.segA=q;C.hist.push('segA');render();return;}
    if(Math.hypot(C.segA[0]-q[0],C.segA[1]-q[1])<1)return;
    C.segs.push([C.segA,q]);C.segA=null;C.hist.push('seg');SFX.play('line');render();checkWin();return;}
  if(C.tool==='pen'){
    if(C.path.length>=3&&Math.hypot(C.path[0][0]-q[0],C.path[0][1]-q[1])<1){SFX.play('line');C.closed=true;C.hist.push('close');render();checkWin();return;}
    const last=C.path[C.path.length-1];if(last&&Math.hypot(last[0]-q[0],last[1]-q[1])<1)return;
    C.path.push(q);C.hist.push('pt');SFX.play(C.path.length>1?'line':'scribble');render();return;}
  const ln={t:C.tool,x:q[0],y:q[1]};
  const dup=C.lines.some(o=>o.t===ln.t&&(ln.t==='h'?Math.abs(o.y-ln.y)<1:ln.t==='v'?Math.abs(o.x-ln.x)<1:Math.abs((o.y-o.x)-(ln.y-ln.x))<1));
  if(!dup){C.lines.push(ln);C.hist.push('line');SFX.play('line');}render();
}
function consBase(){return L().mitre?[{t:'m',x:CREF[0],y:CREF[1]}]:[];}

  const simp=a=>a.filter((p,i)=>{const q=a[(i-1+a.length)%a.length],r=a[(i+1)%a.length];return Math.abs((p[0]-q[0])*(r[1]-p[1])-(p[1]-q[1])*(r[0]-p[0]))>1e-6;});

  for(const seq of [pts,pts.slice().reverse()])for(let o=0;o<seq.length;o++)if(T.every((t,i)=>eq(t,seq[(i+o)%seq.length])))ok=true;
  if(!ok)return false;

const FSYM=['disc','ring','sq','osq','x','plus'];
function drawSym(name){ // in a unit face, centred, local axes; local "up" is -v
  ctx.lineWidth=.1;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.lineCap='round';ctx.setLineDash([]);
  ctx.beginPath();

  else if(name==='sq'){ctx.fillRect(-.24,-.24,.48,.48);}
  else if(name==='osq'){ctx.strokeRect(-.23,-.23,.46,.46);}
  else if(name==='x'){ctx.moveTo(-.24,-.24);ctx.lineTo(.24,.24);ctx.moveTo(.24,-.24);ctx.lineTo(-.24,.24);ctx.stroke();}
  else if(name==='plus'){ctx.moveTo(0,-.3);ctx.lineTo(0,.3);ctx.moveTo(-.3,0);ctx.lineTo(.3,0);ctx.stroke();}

function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of P.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}return lo.slice(0,-1).concat(up.slice(0,-1));}
function sheetSunplate(){
  const l=L(),{GX,GY,cell}=shadowGeo(),N=l.N,W=N*cell,pt=l.paint,[dx,dy]=pt.d;

  const area=[30,118,540,538];ctx.save();ctx.beginPath();ctx.rect(...area);ctx.clip();
  ctx.fillStyle='#eef3e4';ctx.fillRect(...area);
  // painterly ground: soft patches
  const r=rng(73);for(let i=0;i<26;i++){ctx.fillStyle=['#dfe9c8','#e9e2c9','#d8e6dc'][i%3];ctx.beginPath();ctx.arc(area[0]+r()*area[2],area[1]+r()*area[3],30+r()*60,0,7);ctx.fill();}
  // shadows first, then the blocks
  ctx.fillStyle='rgba(47,95,158,0.62)';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const h=l.B[y][x];if(!h)continue;const bx=GX+x*cell,by=GY+y*cell,o=[dx*h*cell,dy*h*cell];
    const q=[[bx,by],[bx+cell,by],[bx+cell,by+cell],[bx,by+cell]];poly(hull(q.concat(q.map(p=>[p[0]+o[0],p[1]+o[1]]))));ctx.fill();}
  if(pt.ref){const px=GX+pt.ref[0]*cell+cell*.5,py=GY+pt.ref[1]*cell+cell*.5;pen(5,null,'rgba(47,95,158,0.8)');ctx.lineCap='round';seg(px,py,px+dx*cell,py+dy*cell);ctx.lineCap='butt';
    ctx.fillStyle='#7a3b1d';ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();txt('1 m',px-10,py-12,10,'right',700,'#7a3b1d');}

/* tiling with tetrominoes or tangram-like quarter pieces */
function tileGeo(){const l=L(),C=l.kind==='tet'?40:50;return{C,BX:Math.round(300-l.W*C/2),BY:Math.round(126+(250-l.H*C)/2)};}
function qPts(x,y,q,g){const{C,BX,BY}=g,X=BX+x*C,Y=BY+y*C,c=[X+C/2,Y+C/2],tl=[X,Y],tr=[X+C,Y],br=[X+C,Y+C],bl=[X,Y+C];return[[tl,tr],[tr,br],[br,bl],[bl,tl]][q].concat([c]);}
function unitsOf(p){return qrots(PLIB[p.n])[p.r%qrots(PLIB[p.n]).length].map(([x,y,q])=>[x+p.x,y+p.y,q]);}
function shapePath(units,g,dx=0,dy=0){const pp=new Path2D();units.forEach(([x,y,q])=>{const pts=qPts(x,y,q,g);pp.moveTo(pts[0][0]+dx,pts[0][1]+dy);pts.slice(1).forEach(p=>pp.lineTo(p[0]+dx,p[1]+dy));pp.closePath();});return pp;}
function outline(units,g,dx=0,dy=0){const cnt=new Map(),k=(a,b)=>{const s=[a,b].map(p=>Math.round(p[0]*2)+','+Math.round(p[1]*2)).sort().join('|');return s;};
  const segs=[];units.forEach(([x,y,q])=>{const p=qPts(x,y,q,g);[[p[0],p[1]],[p[1],p[2]],[p[2],p[0]]].forEach(([a,b])=>{const kk=k(a,b);cnt.set(kk,(cnt.get(kk)||0)+1);segs.push([kk,a,b]);});});
  segs.forEach(([kk,a,b])=>{if(cnt.get(kk)===1)seg(a[0]+dx,a[1]+dy,b[0]+dx,b[1]+dy);});}
function drawTarget(l,g){const tu=l.target;ctx.fillStyle='#fff';ctx.fill(shapePath(tu,g));
  pen(LW.thin);for(let y=0;y<l.H;y++)for(let x=0;x<l.W;x++)if(QF.some(q=>l.tset.has([x,y,q].join(',')))){const X=g.BX+x*g.C,Y=g.BY+y*g.C;ctx.strokeRect(X,Y,g.C,g.C);}
  pen(LW.thick*1.6,[10,5]);outline(tu,g);ctx.setLineDash([]);}
function drawPiece(p,g,i){const u=unitsOf(p),dx=p.drag?p.drag[0]-(g.BX+p.x*g.C):0,dy=p.drag?p.drag[1]-(g.BY+p.y*g.C):0,pp=shapePath(u,g,dx,dy);
  ctx.save();ctx.globalAlpha=.42;ctx.fillStyle=TILE_COL[i%TILE_COL.length];ctx.fill(pp);ctx.restore();
  hatch(pp,[0,0,600,800],[-45,45,0,90,-45,45][i%6],7,LW.thin);pen(LW.thick*1.3);outline(u,g,dx,dy);}
function sheetTileCol(){const l=L(),g=tileGeo();txt('SZÍNES LAP · így áll össze',30,118,10.5);
  // the colour sheet reveals only about a third of the pieces; the rest of the shape stays blank
  l.sol.forEach(([n,r,x,y],i)=>{if(i%3)return;const u=qrots(PLIB[n])[r].map(([a,b,q])=>[a+x,b+y,q]),pp=shapePath(u,g);ctx.fillStyle=TILE_COL[i%TILE_COL.length];ctx.fill(pp);pen(LW.thick);outline(u,g);});
  pen(LW.thick*1.6);outline(l.target,g);noteLine(l);}
function sheetTile(){const l=L(),g=tileGeo();txt('KIRAKÓ · húzd az elemeket a formára',30,118,10.5,'left',700,INK,'alphabetic',540);
  drawTarget(l,g);pen(LW.med);seg(30,392,570,392);txt('ELEMEK',30,410,10.5);

  if(S.anim&&S.anim.p>=1)stamp(300,g.BY+l.H*g.C/2);noteLine(l);}
function tileAt(pt){const g=tileGeo();for(let i=S.tiles.length-1;i>=0;i--){const p=S.tiles[i];
  const x=Math.floor((pt[0]-g.BX)/g.C),y=Math.floor((pt[1]-g.BY)/g.C),dx=pt[0]-(g.BX+(x+.5)*g.C),dy=pt[1]-(g.BY+(y+.5)*g.C);
  const q=Math.abs(dy)>Math.abs(dx)?(dy<0?0:2):(dx>0?1:3);if(unitsOf(p).some(u=>u[0]===x&&u[1]===y&&u[2]===q))return p;}return null;}
function tileSolved(){const l=L(),seenU=new Set();for(const p of S.tiles)for(const u of unitsOf(p)){const k=u.join(',');if(!l.tset.has(k)||seenU.has(k))return false;seenU.add(k);}return seenU.size===l.tset.size;}
// pieces start in the tray under the shape, laid out on the same lattice so they snap
function initTiles(l){const g=tileGeo(),x0=Math.ceil((40-g.BX)/g.C),xMax=Math.floor((560-g.BX)/g.C);let x=x0,y=Math.ceil((420-g.BY)/g.C),rowH=0;

const SFX=(()=>{let ac=null,master=null,noise=null;
  function init(){if(ac)return true;const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;
    ac=new A();master=ac.createGain();master.gain.value=.55;master.connect(ac.destination);
    noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return true;}
  // band-passed noise with an attack/decay envelope; optional frequency sweep and tremolo (pencil grain)
  function hiss({t=0,dur=.1,f0=2000,f1=f0,q=1,type='bandpass',gain=.5,att=.005,trem=0,tremDepth=.7}){
    const now=ac.currentTime+t,src=ac.createBufferSource();src.buffer=noise;src.loop=true;
    const flt=ac.createBiquadFilter();flt.type=type;flt.Q.value=q;flt.frequency.setValueAtTime(f0,now);flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1),now+dur);

    src.connect(flt);flt.connect(g);out.connect(master);src.start(now,Math.random()*.5);src.stop(now+dur+.05);}
  function tone({t=0,dur=.08,f0=300,f1=f0,type='sine',gain=.3}){const now=ac.currentTime+t,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),now+dur);
    g.gain.setValueAtTime(gain,now);g.gain.exponentialRampToValueAtTime(.0008,now+dur);o.connect(g);g.connect(master);o.start(now);o.stop(now+dur+.02);}

    tick:()=>hiss({dur:.018,f0:5200,type:'highpass',gain:.22,att:.001}),
    page:()=>{hiss({dur:.26,f0:r(2600,3200),f1:700,q:.7,gain:.32,att:.04});hiss({t:.2,dur:.03,f0:1800,type:'highpass',gain:.12,att:.002});},
    foilFlip:()=>{for(let i=0;i<4;i++)hiss({t:i*r(.022,.035),dur:.03,f0:r(4200,6500),type:'highpass',gain:.2,att:.001});tone({t:.1,dur:.05,f0:210,f1:150,gain:.18});},
    drop:()=>{hiss({dur:.04,f0:1100,type:'lowpass',gain:.35,att:.002});tone({dur:.06,f0:260,f1:180,gain:.16});},
    slide:()=>hiss({dur:.16,f0:700,f1:420,type:'lowpass',gain:.3,att:.02,trem:38,tremDepth:.5}),
    scribble:()=>hiss({dur:r(.08,.13),f0:r(2600,3400),f1:r(2200,3800),q:2.2,gain:.38,att:.006,trem:r(24,34),tremDepth:.8}),
    line:()=>hiss({dur:.34,f0:2000,f1:3400,q:2.5,gain:.3,att:.03,trem:46,tremDepth:.35}),
    erase:()=>hiss({dur:.2,f0:1000,f1:800,q:1.2,gain:.32,att:.02,trem:15,tremDepth:.9}),
    key:()=>{hiss({dur:.07,f0:4200,f1:3600,q:6,gain:.3,att:.003,trem:60,tremDepth:.6});tone({dur:.04,f0:2300,gain:.05});},
    whoosh:()=>{hiss({dur:.3,f0:300,f1:2400,type:'lowpass',gain:.3,att:.12});},
    stamp:()=>{tone({dur:.16,f0:110,f1:52,gain:.5});hiss({dur:.07,f0:900,type:'lowpass',gain:.45,att:.002});hiss({t:.05,dur:.04,f0:2500,type:'highpass',gain:.12,att:.002});},
    error:()=>{tone({dur:.07,f0:150,type:'square',gain:.07});tone({t:.11,dur:.09,f0:120,type:'square',gain:.07});},
    unlock:()=>{hiss({dur:.02,f0:5000,type:'highpass',gain:.3,att:.001});hiss({t:.09,dur:.03,f0:3200,type:'highpass',gain:.35,att:.001});tone({t:.15,dur:.25,f0:520,f1:1040,type:'triangle',gain:.12});},

  return{play(name,minGap=0){if(!S.set.sound||!init())return;if(ac.state==='suspended')ac.resume();const n=performance.now();

  button(X+152,Y+472,52,48,'+',false,()=>setF(fb+1),'nagyobb');
  button(X+214,Y+472,90,48,'AUTO',S.set.font==null,()=>{S.set.font=null;save();render();},sg(autoBoost()));
  txt('Árvíztűrő',X+316,Y+504,10,'left',700,INK,'alphabetic',70);
  button(X+20,Y+H-58,300,44,'ELŐREHALADÁS TÖRLÉSE',false,()=>{S.settings=false;S.popup='RESET';render();});
  button(X+W-130,Y+H-58,110,44,'KÉSZ',true,()=>{S.settings=false;render();});
}

/* ---------- post-processing ---------- */
const bayer=n=>{let m=[[0]];while(m.length<n){const s=m.length,r=[];for(let y=0;y<2*s;y++){r.push([]);for(let x=0;x<2*s;x++)r[y].push(m[y%s][x%s]*4+[0,2,3,1][(y<s?0:2)+(x<s?0:1)]);}m=r;}return m;};
const B8=(()=>{let m=[[0]];while(m.length<8){const s=m.length,r=[];for(let y=0;y<2*s;y++){r.push([]);for(let x=0;x<2*s;x++)r[y].push(m[y%s][x%s]*4+[0,2,3,1][(y<s?0:2)+(x<s?0:1)]);}m=r;}return m;})();
function post(w,h){
  const st=S.set;if(st.mode==='raw'&&!st.kal&&!st.tone)return;
  const img=ctx.getImageData(0,0,w,h),d=img.data,N=w*h,Lm=new Float32Array(N);
  for(let k=0;k<N;k++){const i=4*k;Lm[k]=.299*d[i]+.587*d[i+1]+.114*d[i+2];}
  let cr=null;
  if(st.kal&&st.mode!=='g16'){cr=new Float32Array(N*3);
    for(let by=0;by<h;by+=2)for(let bx=0;bx<w;bx+=2){let r=0,g=0,b=0,n=0,l=0;
      for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const x=bx+dx,y=by+dy;if(x<w&&y<h){const k=y*w+x,i=4*k;r+=d[i];g+=d[i+1];b+=d[i+2];l+=Lm[k];n++;}}
      r/=n;g/=n;b/=n;l/=n;
      for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const x=bx+dx,y=by+dy;if(x<w&&y<h){const k=3*(y*w+x);cr[k]=(r-l)*.6;cr[k+1]=(g-l)*.6;cr[k+2]=(b-l)*.6;}}}}
  if(st.mode==='g16'||(st.mode==='raw'&&st.kal)){for(let k=0;k<N;k++)Lm[k]=Math.round(Lm[k]/17)*17;}
  else if(st.mode==='fs'){for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x,o=Lm[k],nv=o<128?0:255,e=o-nv;Lm[k]=nv;
      if(x<w-1)Lm[k+1]+=e*7/16;if(y<h-1){if(x>0)Lm[k+w-1]+=e*3/16;Lm[k+w]+=e*5/16;if(x<w-1)Lm[k+w+1]+=e/16;}}}
  else if(st.mode==='b8'){for(let y=0;y<h;y++){const row=B8[y&7];for(let x=0;x<w;x++){const k=y*w+x;Lm[k]=Lm[k]>(row[x&7]+.5)/64*255?255:0;}}}
  const keepColor=st.mode==='raw'&&!st.kal;
  const q=v=>v<0?0:v>255?255:Math.round(v/17)*17;
  const P=st.kal?[226,224,215]:[233,233,228],K=st.kal?[40,40,44]:[26,26,28];
  for(let k=0;k<N;k++){const i=4*k;let r,g,b;
    if(keepColor){r=d[i];g=d[i+1];b=d[i+2];}
    else if(cr){r=q(Lm[k]+cr[3*k]);g=q(Lm[k]+cr[3*k+1]);b=q(Lm[k]+cr[3*k+2]);}
    else r=g=b=Lm[k]<0?0:Lm[k]>255?255:Lm[k];
    if(st.tone||st.kal){r=K[0]+(P[0]-K[0])*r/255;g=K[1]+(P[1]-K[1])*g/255;b=K[2]+(P[2]-K[2])*b/255;}
    d[i]=r;d[i+1]=g;d[i+2]=b;}
  ctx.putImageData(img,0,0);
}

/* ---------- render ---------- */
let rawFrame=null;
const GHOST_A=.35,GHOST_DECAY=.5,GHOST_MIN=.07;
const flashEl=document.getElementById('flash');
function flash(cb,fast){
  const t1=fast?45:140,t2=fast?35:110;flashEl.hidden=false;flashEl.style.background=INK;
  setTimeout(()=>{flashEl.style.background='#fff';cb();setTimeout(()=>{flashEl.hidden=true;},t2);},t1);
}
function render(){
  const w=cv.width,h=cv.height;hits=[];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  const k=Math.min(w/PAGE.W,h/PAGE.H);G.k=k;G.ox=(w-PAGE.W*k)/2;G.oy=(h-PAGE.H*k)/2;
  ctx.setTransform(k,0,0,k,G.ox,G.oy);ctx.lineCap='butt';ctx.lineJoin='miter';
  applyLW();
  if(S.popup!=='LOCK'&&!lockEl.hidden)lockEl.hidden=true;
  if(S.screen!=='game'){(S.screen==='title'?drawTitle:drawToc)();ctx.setLineDash([]);
    if(S.settings)drawSettings();if(S.popup)drawPopup();ctx.setTransform(1,0,0,1,0,0);post(w,h);return;}
  const t=L().sheets[S.sheet];
  ({views:sheetViews,plate:sheetPlate,foil:sheetFoil,chain:sheetChain,drill:sheetDrill,cons:sheetCons,barrier:sheetBarrier,log:sheetLog,wires:sheetWires,fold:sheetFold,shadow:sheetShadow,sunplate:sheetSunplate,room:sheetRoom,key:sheetKey,sky:sheetSky,tile:sheetTile,tilecol:sheetTileCol,pick:sheetPick,skyview:sheetSkyView,sunM:()=>sheetSun('sunM'),sunN:()=>sheetSun('sunN'),sunA:()=>sheetSun('sunA'),plan:sheetPlan})[t]();
  ctx.setLineDash([]);drawFrame();
  ctx.setTransform(1,0,0,1,0,0);
  if(!rawFrame||rawFrame.width!==w||rawFrame.height!==h){rawFrame=document.createElement('canvas');rawFrame.width=w;rawFrame.height=h;}
  rawFrame.getContext('2d').drawImage(cv,0,0);
  if(S.ghosts.length){const k=G.k;ctx.save();ctx.beginPath();ctx.rect(G.ox+20*k,G.oy+86*k,560*k,620*k);ctx.clip();ctx.globalCompositeOperation='multiply';
    for(const g of S.ghosts)if(g.c.width===w&&g.c.height===h){ctx.globalAlpha=g.a;ctx.drawImage(g.c,0,0);}
    ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  if(S.settings||S.popup){ctx.setTransform(G.k,0,0,G.k,G.ox,G.oy);ctx.setLineDash([]);if(S.settings)drawSettings();if(S.popup)drawPopup();ctx.setTransform(1,0,0,1,0,0);}
  post(w,h);
}
function goSheet(i){
  if(S.screen!=='game'||i===S.sheet)return;SFX.play('page');if(S.settings){S.settings=false;render();}
  if(S.set.refresh==='full'){S.ghosts=[];S.cleaned=true;S.sheet=i;flash(render,true);return;}
  // the sheet we leave stays on the panel as a residue; older residues weaken with every page change
  const g=document.createElement('canvas');g.width=rawFrame.width;g.height=rawFrame.height;g.getContext('2d').drawImage(rawFrame,0,0);
  const full=L().ghostFull&&['plate','sunplate'].includes(L().sheets[S.sheet]);
  S.ghosts=S.ghosts.filter(o=>!(full&&o.sticky)).map(o=>o.sticky?o:({c:o.c,a:o.a*GHOST_DECAY})).filter(o=>o.a>=GHOST_MIN);if(full)S.ghosts.push({c:g,a:GHOST_A,sticky:true});else if(!L().ghostFull)S.ghosts.push({c:g,a:GHOST_A});
  S.sheet=i;render();
}
function resize(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));S.ghosts=[];render();if(!S.cleaned&&S.screen==='game')injectStale();}

/* ---------- interaction ---------- */
function toPage(e){const r=cv.getBoundingClientRect(),sx=cv.width/r.width;return[((e.clientX-r.left)*sx-G.ox)/G.k,((e.clientY-r.top)*sx-G.oy)/G.k];}
function gridInfo(){const l=L(),t=l.sheets[S.sheet];
  if(t==='plan'){const g=geo();return{GX:g.GX,GY:g.GY,cell:g.cell,max:()=>l.maxH};}
  if(t==='chain'){const g=chainGeo();return{...g,max:()=>1};}
  if(t==='sky'){const g=skyGeo();return{GX:g.GX,GY:g.GY,cell:g.cell,max:()=>l.N};}
  if(t==='shadow'){const g=shadowGeo();return{...g,max:(x,y)=>l.B[y][x]&&!l.roofs?0:1};}
  if(t==='drill'){const g=drillGeo();return{GX:g.GX,GY:g.GY,cell:g.cell,max:(x,y)=>l.hgt[y][x]};}
  return null;}
function cellAt(p){const l=L();if(S.settings)return null;const gi=gridInfo();if(!gi)return null;
  const x=Math.floor((p[0]-gi.GX)/gi.cell),y=Math.floor((p[1]-gi.GY)/gi.cell);
  return x>=0&&y>=0&&x<l.N&&y<l.N&&gi.max(x,y)>0?[x,y]:null;}
function undo(){if(S.undo.length){SFX.play('erase');S.grid=S.undo.pop();S.anim=null;render();}}
let drag=null,down=null,raf=0,fd=null,bd=null,sd=false,rd=null,td=null;
function foilAt(p){if(S.settings||L().sheets[S.sheet]!=='foil')return null;
  for(let i=S.foils.length-1;i>=0;i--){const f=S.foils[i],[x,y,w,h]=foilRect(f);if(p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h)return f;}return null;}
function placeFoil(f,tl){SFX.play('drop');
  const{GX,GY,cell}=geo(),N=L().N,[w,h]=fdim(f),gx=Math.round((tl[0]-GX)/cell),gy=Math.round((tl[1]-GY)/cell);
  f.at=((f.scl||1)===1&&gx>=0&&gy>=0&&gx+w<=N&&gy+h<=N)?[gx,gy]:null;}
function rotateFoil(f){SFX.play('foilFlip');
  if(!f.at){f.rot=(f.rot+1)%4;return;}
  const[w,h]=fdim(f),cx=f.at[0]+w/2,cy=f.at[1]+h/2;f.rot=(f.rot+1)%4;const[nw,nh]=fdim(f),N=L().N;
  if(nw>N||nh>N){f.at=null;return;}
  f.at=[Math.min(N-nw,Math.max(0,Math.round(cx-nw/2))),Math.min(N-nh,Math.max(0,Math.round(cy-nh/2)))];}
cv.addEventListener('pointerdown',e=>{
  SFX.unlock();
  const p=toPage(e);down={p,cx:e.clientX,cy:e.clientY};
  if(S.screen!=='game'||S.popup)return;
  if(!S.settings&&L().sheets[S.sheet]==='barrier'&&!S.bar.on&&p[0]>=BSW[0]&&p[0]<=BSW[0]+BSW[2]&&p[1]>=BSW[1]&&p[1]<=BSW[1]+BSW[3]){
    cv.setPointerCapture(e.pointerId);sd=true;S.bar.drag=p;render();return;}
  if(!S.settings&&L().sheets[S.sheet]==='barrier'&&S.bar.on&&p[0]>=BAREA[0]&&p[0]<=BAREA[0]+BAREA[2]&&p[1]>=BAREA[1]&&p[1]<=BAREA[1]+BAREA[3]){
    cv.setPointerCapture(e.pointerId);bd={x0:p[0],off0:S.bar.off};return;}
  if(!S.settings&&L().sheets[S.sheet]==='tile'){const pc=tileAt(p);
    if(pc){const g=tileGeo();cv.setPointerCapture(e.pointerId);S.tiles.splice(S.tiles.indexOf(pc),1);S.tiles.push(pc);
      td={p:pc,off:[p[0]-(g.BX+pc.x*g.C),p[1]-(g.BY+pc.y*g.C)],cx:e.clientX,cy:e.clientY,moved:false};return;}}
  if(!S.settings&&L().sheets[S.sheet]==='room'){const{C,RX,RY}=roomGeo();
    const it=S.room.slice().reverse().find(o=>{const[w,h]=itemDims(o);return p[0]>=RX+o.x*C&&p[0]<=RX+(o.x+w)*C&&p[1]>=RY+o.y*C&&p[1]<=RY+(o.y+h)*C;});
    if(it){cv.setPointerCapture(e.pointerId);rd={it,off:[p[0]-(RX+it.x*C),p[1]-(RY+it.y*C)],cx:e.clientX,cy:e.clientY,moved:false};return;}}
  const f=foilAt(p);
  if(f){S.selFoil=f;cv.setPointerCapture(e.pointerId);const r=foilRect(f);fd={f,off:[p[0]-r[0],p[1]-r[1]],cx:e.clientX,cy:e.clientY,moved:false};
    S.foils.splice(S.foils.indexOf(f),1);S.foils.push(f);render();return;}
  const c=cellAt(p);
  if(c&&!(S.anim&&S.anim.p<1)){cv.setPointerCapture(e.pointerId);const l=L();S.undo.push(S.grid.map(r=>r.slice()));if(S.undo.length>200)S.undo.shift();
    SFX.play('scribble');const mx=gridInfo().max(c[0],c[1]);const v=(S.grid[c[1]][c[0]]+1)%(mx+1);S.grid[c[1]][c[0]]=v;S.anim=null;drag={v,done:new Set([c+''])};render();}
});
cv.addEventListener('pointermove',e=>{
  if(td){if(!td.moved&&Math.hypot(e.clientX-td.cx,e.clientY-td.cy)<10)return;td.moved=true;const p=toPage(e);td.p.drag=[p[0]-td.off[0],p[1]-td.off[1]];cancelAnimationFrame(raf);raf=requestAnimationFrame(render);return;}
  if(rd){if(!rd.moved&&Math.hypot(e.clientX-rd.cx,e.clientY-rd.cy)<10)return;rd.moved=true;const p=toPage(e);rd.it.drag=[p[0]-rd.off[0],p[1]-rd.off[1]];cancelAnimationFrame(raf);raf=requestAnimationFrame(render);return;}
  if(sd){S.bar.drag=toPage(e);cancelAnimationFrame(raf);raf=requestAnimationFrame(render);return;}
  if(bd){const p=toPage(e);S.bar.off=bd.off0+(p[0]-bd.x0)/5;cancelAnimationFrame(raf);raf=requestAnimationFrame(render);return;}
  if(fd){if(!fd.moved&&Math.hypot(e.clientX-fd.cx,e.clientY-fd.cy)<10)return;fd.moved=true;const p=toPage(e);
    fd.f.dragAt=[p[0]-fd.off[0],p[1]-fd.off[1]];cancelAnimationFrame(raf);raf=requestAnimationFrame(render);return;}
  if(!drag)return;const c=cellAt(toPage(e));if(!c||drag.done.has(c+''))return;
  drag.done.add(c+'');SFX.play('scribble',60);S.grid[c[1]][c[0]]=Math.min(drag.v,gridInfo().max(c[0],c[1]));cancelAnimationFrame(raf);raf=requestAnimationFrame(render);
});
cv.addEventListener('pointerup',e=>{
  if(td){const pc=td.p,g=tileGeo();
    if(td.moved){pc.x=Math.round((pc.drag[0]-g.BX)/g.C);pc.y=Math.round((pc.drag[1]-g.BY)/g.C);pc.drag=null;SFX.play('drop');}
    else{pc.r=(pc.r+1)%qrots(PLIB[pc.n]).length;SFX.play('foilFlip');}
    td=null;down=null;S.anim=null;render();checkWin();return;}
  if(rd){const it=rd.it,{C,RX,RY}=roomGeo();
    if(rd.moved){const nx=Math.round((it.drag[0]-RX)/C),ny=Math.round((it.drag[1]-RY)/C);it.drag=null;if(placeOk(it,nx,ny)){it.x=nx;it.y=ny;SFX.play('slide');}else SFX.play('error');}
    else{const r0=it.r,x0=it.x,y0=it.y,[w0,h0]=itemDims(it);let done=false;
      for(let k=1;k<4&&!done;k++){it.r=r0+k;const[w,h]=itemDims(it),cand=[];
        for(let dy=-(h-1);dy<h0;dy++)for(let dx=-(w-1);dx<w0;dx++)cand.push([x0+dx,y0+dy,Math.abs(dx)+Math.abs(dy)]);
        cand.sort((a,b)=>a[2]-b[2]);for(const[x,y]of cand)if(placeOk(it,x,y)){it.x=x;it.y=y;done=true;break;}}
      if(!done){it.r=r0;it.x=x0;it.y=y0;SFX.play('error');}else SFX.play('slide');}
    rd=null;down=null;S.anim=null;render();checkWin();return;}
  if(sd){const q=S.bar.drag;sd=false;S.bar.drag=null;down=null;
    if(q&&q[0]>=BAREA[0]&&q[0]<=BAREA[0]+BAREA[2]&&q[1]>=BAREA[1]&&q[1]<=BAREA[1]+BAREA[3]){S.bar.on=true;SFX.play('drop');}render();return;}
  if(bd){SFX.play('slide');S.bar.off=Math.round(S.bar.off/BW)*BW;bd=null;down=null;render();return;}
  if(fd){const f=fd.f;if(fd.moved){const tl=f.dragAt;f.dragAt=null;placeFoil(f,tl);}else rotateFoil(f);fd=null;down=null;render();return;}
  if(drag){drag=null;checkWin();down=null;return;}
  if(!down)return;const dx=e.clientX-down.cx,dy=e.clientY-down.cy,p=down.p;down=null;
  if(S.popup){if(Math.hypot(dx,dy)>14)return;const h=hits.find(b=>p[0]>=b.x&&p[0]<=b.x+b.w&&p[1]>=b.y&&p[1]<=b.y+b.h);if(h){SFX.play('tick');h.fn();}return;}
  if(S.screen==='toc'&&!S.settings&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){const n=tocPages(),i=S.toc.page+(dx<0?1:-1);if(i>=0&&i<n){S.toc.page=i;render();}return;}
  const n=L().sheets.length;
  if(S.screen==='game'&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){const i=S.sheet+(dx<0?1:-1);if(i>=0&&i<n)goSheet(i);return;}
  if(Math.hypot(dx,dy)>14)return;
  const h=hits.find(b=>p[0]>=b.x&&p[0]<=b.x+b.w&&p[1]>=b.y&&p[1]<=b.y+b.h);if(h){SFX.play('tick');h.fn();return;}
  if(S.screen!=='game')return;
  if(!S.settings&&L().sheets[S.sheet]==='cons')consTap(p);
  if(!S.settings&&L().sheets[S.sheet]==='fold'){const l=L(),x=Math.floor((p[0]-FNET.x)/FNET.cs),y=Math.floor((p[1]-FNET.y)/FNET.cs),k=x+','+y;
    if(l.spec[k]){SFX.play('scribble');const sel=S.fold.sel,i=sel.indexOf(k);if(i>=0)sel.splice(i,1);else if(sel.length<3)sel.push(k);S.anim=null;render();if(sel.length===3)checkWin();}}
});
cv.addEventListener('pointercancel',()=>{bd=null;if(td){td.p.drag=null;td=null;render();}if(rd){rd.it.drag=null;rd=null;render();}if(sd){sd=false;S.bar.drag=null;render();}if(fd){fd.f.dragAt=null;fd=null;render();}drag=null;down=null;});
addEventListener('keydown',e=>{if(S.screen!=='game')return;const n=L().sheets.length;
  if(e.key==='ArrowRight'&&S.sheet<n-1)goSheet(S.sheet+1);else if(e.key==='ArrowLeft'&&S.sheet>0)goSheet(S.sheet-1);
  else if((e.ctrlKey||e.metaKey)&&e.key==='z')undo();});
function checkWin(){
  if(!L().check(S.grid)){render();return;}
  S.solved[sk(S.lvl)]=1;save();setTimeout(()=>SFX.play('stamp'),matchMedia('(prefers-reduced-motion: reduce)').matches?0:1050);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){S.anim={p:1};render();return;}
  const t0=performance.now();S.anim={p:0};
  const step=()=>{if(!S.anim)return;S.anim.p=Math.min(1,(performance.now()-t0)/1100);render();if(S.anim.p<1)setTimeout(step,70);};step();
}

startLevel(S.lvl);
new ResizeObserver(()=>resize()).observe(cv);
if(document.fonts){document.fonts.load('700 12px "Roboto Mono"').then(render).catch(()=>{});document.fonts.ready.then(render);}
window.__takart={S,LEVELS,EASY,startLevel,goSheet,render,checkWin,openToc,openGame,T,openRandom,GEN_TYPES,qrots,PLIB,isoVisibility};
})();
